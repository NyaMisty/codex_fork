name: rust-release-windows

on:
  workflow_call:
    inputs:
      release-lto:
        required: true
        type: string
      sign-windows:
        required: true
        type: boolean
    secrets:
      AZURE_TRUSTED_SIGNING_CLIENT_ID:
        required: false
      AZURE_TRUSTED_SIGNING_TENANT_ID:
        required: false
      AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false

jobs:
  build-windows-binaries:
    name: Build Windows binaries - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    # Windows release builds can exceed an hour on fat-LTO mainline releases,
    # so keep the timeout aligned with the top-level release build headroom.
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      USE_SCCACHE: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_GHA_ENABLED: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "packed"
      CARGO_PROFILE_RELEASE_STRIP: "none"
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release-lto }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-responses-api-proxy"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-responses-api-proxy"
            runs_on: windows-11-arm
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
            runs_on: windows-11-arm
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server"
            runs_on: windows-11-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Print runner specs (Windows)
        shell: powershell
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ramGiB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 1)
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($computer.NumberOfLogicalProcessors)"
          Write-Host "Physical CPUs: $($computer.NumberOfProcessors)"
          Write-Host "Total RAM: $ramGiB GiB"
          Write-Host "Disk usage:"
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize Name, @{Name='Size(GB)';Expression={[math]::Round(($_.Used + $_.Free) / 1GB, 1)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free / 1GB, 1)}}
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: cargo-bins/cargo-binstall@v1.19.1
      - name: Install sccache
        id: install_sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            installed_version="$(sccache --version || true)"
            echo "${installed_version}"
            if [[ "${installed_version}" == "sccache 0.15.0" ]]; then
              exit 0
            fi
          fi
          cargo binstall --no-confirm --force sccache@0.15.0
          sccache --version

      - name: Configure sccache GitHub cache variables
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure sccache backend
        id: configure_sccache_backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_RESULTS_URL:-}" || -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "GitHub Actions cache variables are required for sccache GHA backend."
            echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:+set}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:+set}"
            exit 1
          fi
          cache_scope="${GITHUB_REF_NAME:-main}"
          cache_scope="${cache_scope//[^A-Za-z0-9_.-]/-}"
          cache_prefix="sccache-${cache_scope}-release-windows-${{ matrix.target }}-${{ matrix.bundle }}"
          main_cache_prefix="sccache-main-release-windows-${{ matrix.target }}-${{ matrix.bundle }}"
          export ACTIONS_CACHE_SERVICE_V2=on
          export SCCACHE_GHA_ENABLED=true
          export SCCACHE_GHA_CACHE_URL="${ACTIONS_RESULTS_URL}"
          export SCCACHE_GHA_RUNTIME_TOKEN="${ACTIONS_RUNTIME_TOKEN}"
          export SCCACHE_GHA_CACHE_TO="${cache_prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export SCCACHE_GHA_CACHE_FROM="${SCCACHE_GHA_CACHE_TO},${cache_prefix}-,${cache_prefix},${main_cache_prefix}-,${main_cache_prefix}"
          export SCCACHE_ERROR_LOG="${RUNNER_TEMP}/sccache-release-windows-${{ matrix.target }}-${{ matrix.bundle }}.log"
          {
            echo "ACTIONS_CACHE_SERVICE_V2=${ACTIONS_CACHE_SERVICE_V2}"
            echo "SCCACHE_GHA_ENABLED=${SCCACHE_GHA_ENABLED}"
            echo "SCCACHE_GHA_CACHE_URL=${SCCACHE_GHA_CACHE_URL}"
            echo "SCCACHE_GHA_RUNTIME_TOKEN=${SCCACHE_GHA_RUNTIME_TOKEN}"
            echo "SCCACHE_GHA_CACHE_TO=${SCCACHE_GHA_CACHE_TO}"
            echo "SCCACHE_GHA_CACHE_FROM=${SCCACHE_GHA_CACHE_FROM}"
            echo "SCCACHE_ERROR_LOG=${SCCACHE_ERROR_LOG}"
          } >> "$GITHUB_ENV"
          echo "Using sccache GitHub Actions backend"

          for attempt in 1 2 3 4 5; do
            if sccache --start-server; then
              sccache --show-stats || true
              exit 0
            fi
            sleep_seconds=$((attempt * 15))
            echo "sccache GHA backend startup failed on attempt ${attempt}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done
          echo "sccache GHA backend failed to start after retries"
          exit 1

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cargo build (Windows binaries)
        shell: bash
        run: |
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target ${{ matrix.target }} --release --timings "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-release-windows-${{ matrix.target }}-${{ matrix.bundle }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true' && steps.configure_sccache_backend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          sccache --show-stats || true
          if [[ -n "${SCCACHE_ERROR_LOG:-}" && -f "${SCCACHE_ERROR_LOG}" ]]; then
            echo "sccache error log tail:"
            tail -200 "${SCCACHE_ERROR_LOG}" || true
          fi

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true' && steps.configure_sccache_backend.outcome == 'success'
        shell: bash
        run: |
          {
            echo "### sccache stats - release windows ${{ matrix.target }} (${{ matrix.bundle }})";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
            if [[ -n "${SCCACHE_ERROR_LOG:-}" && -f "${SCCACHE_ERROR_LOG}" ]]; then
              echo;
              echo "#### sccache error log tail";
              echo;
              echo '```';
              tail -200 "${SCCACHE_ERROR_LOG}" || true;
              echo '```';
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          output_dir="target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}"
          mkdir -p "$output_dir"

          file_size() {
            wc -c < "$1" | tr -d '[:space:]'
          }

          require_file_min_size() {
            local file="$1"
            local min_size="$2"
            if [[ ! -f "$file" ]]; then
              echo "required Windows artifact file is missing: $file"
              exit 1
            fi

            local size
            size="$(file_size "$file")"
            if (( size < min_size )); then
              echo "Windows artifact file $file is only ${size} bytes; expected at least ${min_size} bytes"
              exit 1
            fi
          }

          stage_pdb() {
            local binary="$1"
            local candidate
            local pdb_source=""
            for candidate in \
              "target/${{ matrix.target }}/release/${binary}.pdb" \
              "target/${{ matrix.target }}/release/deps/${binary}.pdb" \
              "target/${{ matrix.target }}/release/deps/${binary//-/_}.pdb" \
              "target/${{ matrix.target }}/release/${binary//-/_}.pdb"; do
              if [[ -f "$candidate" ]]; then
                pdb_source="$candidate"
                break
              fi
            done

            if [[ -z "$pdb_source" ]]; then
              echo "required symbol file missing for ${binary}"
              exit 1
            fi

            cp "$pdb_source" "$output_dir/${binary}.pdb"
            require_file_min_size "$output_dir/${binary}.pdb" 1000000
          }

          for binary in ${{ matrix.binaries }}; do
            cp "target/${{ matrix.target }}/release/${binary}.exe" "$output_dir/${binary}.exe"
            min_size=100000
            if [[ "$binary" == "codex" ]]; then
              min_size=50000000
            fi
            require_file_min_size "$output_dir/${binary}.exe" "$min_size"
            stage_pdb "$binary"
          done

      - name: Upload Windows binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-binaries-${{ matrix.target }}-${{ matrix.bundle }}
          path: |
            codex-rs/target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}/*

  build-windows:
    needs:
      - build-windows-binaries
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    env:
      WINDOWS_BINARIES: "codex codex-responses-api-proxy codex-windows-sandbox-setup codex-command-runner codex-app-server"
      SIGN_WINDOWS: ${{ inputs.sign-windows }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            runs_on: windows-11-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download prebuilt Windows primary binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-primary
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Download prebuilt Windows helper binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-helpers
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Download prebuilt Windows app-server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-app-server
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          file_size() {
            wc -c < "$1" | tr -d '[:space:]'
          }

          require_file_min_size() {
            local file="$1"
            local min_size="$2"
            if [[ ! -f "$file" ]]; then
              echo "required Windows artifact file is missing: $file"
              exit 1
            fi

            local size
            size="$(file_size "$file")"
            if (( size < min_size )); then
              echo "Windows artifact file $file is only ${size} bytes; expected at least ${min_size} bytes"
              exit 1
            fi
          }

          for binary in ${WINDOWS_BINARIES}; do
            exe_path="target/${{ matrix.target }}/release/${binary}.exe"
            min_size=100000
            if [[ "$binary" == "codex" ]]; then
              min_size=50000000
            fi
            require_file_min_size "$exe_path" "$min_size"
            ls -lh "$exe_path"
            pdb_candidates=(
              "target/${{ matrix.target }}/release/${binary}.pdb"
              "target/${{ matrix.target }}/release/deps/${binary}.pdb"
              "target/${{ matrix.target }}/release/deps/${binary//-/_}.pdb"
              "target/${{ matrix.target }}/release/${binary//-/_}.pdb"
            )
            found_pdb=""
            for candidate in "${pdb_candidates[@]}"; do
              if [[ -f "$candidate" ]]; then
                found_pdb="$candidate"
                break
              fi
            done
            if [[ -z "$found_pdb" ]]; then
              echo "missing PDB for ${binary}"
              exit 1
            fi
            require_file_min_size "$found_pdb" 1000000
            ls -lh "$found_pdb"
          done

      - name: Sign Windows binaries with Azure Trusted Signing
        if: ${{ inputs.sign-windows }}
        uses: ./.github/actions/windows-code-sign
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.WINDOWS_BINARIES }}
          client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${{ matrix.target }}"
          mkdir -p "$dest"

          stage_pdb() {
            local binary="$1"
            local candidate
            local pdb_source=""
            for candidate in \
              "target/${{ matrix.target }}/release/${binary}.pdb" \
              "target/${{ matrix.target }}/release/deps/${binary}.pdb" \
              "target/${{ matrix.target }}/release/deps/${binary//-/_}.pdb" \
              "target/${{ matrix.target }}/release/${binary//-/_}.pdb"; do
              if [[ -f "$candidate" ]]; then
                pdb_source="$candidate"
                break
              fi
            done

            if [[ -z "$pdb_source" ]]; then
              echo "required symbol file missing for ${binary}"
              exit 1
            fi

            cp "$pdb_source" "$dest/${binary}-${{ matrix.target }}.pdb"
          }

          for binary in ${WINDOWS_BINARIES}; do
            cp "target/${{ matrix.target }}/release/${binary}.exe" \
              "$dest/${binary}-${{ matrix.target }}.exe"
            stage_pdb "$binary"
          done

      - name: Build Python runtime wheel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            codex_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          else
            codex_version="${GITHUB_REF_NAME}"
          fi

          case "${{ matrix.target }}" in
            aarch64-pc-windows-msvc)
              platform_tag="win_arm64"
              ;;
            x86_64-pc-windows-msvc)
              platform_tag="win_amd64"
              ;;
            *)
              echo "No Python runtime wheel platform tag for ${{ matrix.target }}"
              exit 1
              ;;
          esac

          python -m venv "${RUNNER_TEMP}/python-runtime-build-venv"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m pip install build

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${{ matrix.target }}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${{ matrix.target }}"
          # Keep the helpers next to codex.exe in the runtime wheel so Windows
          # sandbox/elevation lookup matches the standalone release zip.
          python "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py" \
            stage-runtime \
            "$stage_dir" \
            "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex.exe" \
            --codex-version "$codex_version" \
            --platform-tag "$platform_tag" \
            --resource-binary "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe" \
            --resource-binary "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m build --wheel --outdir "$wheel_dir" "$stage_dir"

      - name: Upload Python runtime wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-runtime-wheel-${{ matrix.target }}
          path: python-runtime-dist/${{ matrix.target }}/*.whl
          if-no-files-found: error

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Compress artifacts
        shell: bash
        run: |
          # Path that contains the uncompressed binaries for the current
          # ${{ matrix.target }}
          dest="dist/${{ matrix.target }}"
          repo_root=$PWD

          # For compatibility with environments that lack the `zstd` tool we
          # additionally create a `.tar.gz` and `.zip` for every Windows binary.
          # The end result is:
          #   codex-<target>.zst
          #   codex-<target>.tar.gz
          #   codex-<target>.zip
          for f in "$dest"/*; do
            base="$(basename "$f")"
            # Skip files that are already archives (shouldn't happen, but be
            # safe).
            if [[ "$base" == *.tar.gz || "$base" == *.zip || "$base" == *.dmg ]]; then
              continue
            fi

            # Don't try to compress signature bundles.
            if [[ "$base" == *.sigstore ]]; then
              continue
            fi

            # Create per-binary tar.gz
            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"

            # Create zip archive for Windows binaries.
            # Must run from inside the dest dir so 7z won't embed the
            # directory path inside the zip.
            if [[ "$base" == "codex-${{ matrix.target }}.exe" ]]; then
              # Bundle the sandbox helper binaries into the main codex zip so
              # WinGet installs include the required helpers next to codex.exe.
              # Fall back to the single-binary zip if the helpers are missing
              # to avoid breaking releases.
              bundle_dir="$(mktemp -d)"
              runner_src="$dest/codex-command-runner-${{ matrix.target }}.exe"
              setup_src="$dest/codex-windows-sandbox-setup-${{ matrix.target }}.exe"
              if [[ -f "$runner_src" && -f "$setup_src" ]]; then
                cp "$dest/$base" "$bundle_dir/$base"
                cp "$runner_src" "$bundle_dir/codex-command-runner.exe"
                cp "$setup_src" "$bundle_dir/codex-windows-sandbox-setup.exe"
                # Use an absolute path so bundle zips land in the real dist
                # dir even when 7z runs from a temp directory.
                (cd "$bundle_dir" && 7z a "$repo_root/$dest/${base}.zip" .)
              else
                echo "warning: missing sandbox binaries; falling back to single-binary zip"
                echo "warning: expected $runner_src and $setup_src"
                (cd "$dest" && 7z a "${base}.zip" "$base")
              fi
              rm -rf "$bundle_dir"
            else
              (cd "$dest" && 7z a "${base}.zip" "$base")
            fi

            # Keep raw executables and produce .zst alongside them.
            "${GITHUB_WORKSPACE}/.github/workflows/zstd" -T0 -19 "$dest/$base"
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            codex-rs/dist/${{ matrix.target }}/*
