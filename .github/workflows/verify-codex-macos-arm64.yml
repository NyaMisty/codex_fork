name: verify-codex-macos-arm64

on:
  push:
    paths:
      - ".github/workflows/verify-codex-macos-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # Same free Apple Silicon runner class used for the build.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-aarch64-apple-darwin
          run-id: 43224499560
          github-token: ${{ github.token }}
          path: artifact

      - name: Verify signature and version
        run: |
          cd artifact
          tar xzf codex-aarch64-apple-darwin.tar.gz
          file codex
          codesign --verify --verbose=2 codex
          ./codex --version

      - name: Start cyber-policy mock server
        run: |
          cat > "$RUNNER_TEMP/mock_cyber.py" <<'PY'
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          log_path = sys.argv[1]
          request_count = 0
          cyber_sent = False

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  global request_count, cyber_sent
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length).decode("utf-8", "replace")
                  if not cyber_sent and "hello" in body:
                      cyber_sent = True
                      response_kind = "cyber"
                  else:
                      response_kind = "completed"
                  request_count += 1
                  with open(log_path, "a", encoding="utf-8") as log:
                      log.write(json.dumps({
                          "n": request_count,
                          "response": response_kind,
                          "body": body,
                      }) + "\n")

                  if response_kind == "cyber":
                      payload = json.dumps({
                          "error": {
                              "message": "CYBER_TEST_MARKER_9137",
                              "type": "invalid_request_error",
                              "code": "cyber_policy",
                          }
                      }).encode()
                      self.send_response(400)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                      return

                  events = [
                      {"type": "response.created", "response": {"id": "resp-auto-continue"}},
                      {
                          "type": "response.completed",
                          "response": {
                              "id": "resp-auto-continue",
                              "usage": {
                                  "input_tokens": 0,
                                  "input_tokens_details": None,
                                  "output_tokens": 0,
                                  "output_tokens_details": None,
                                  "total_tokens": 0,
                              },
                          },
                      },
                  ]
                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  payload = b"{}"
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/mock_cyber.py" "$RUNNER_TEMP/cyber_requests.jsonl" > "$RUNNER_TEMP/mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock.pid"
          sleep 1

      - name: Cyber policy must insert an error and auto-continue
        run: |
          set +e
          out=$(MOCK_API_KEY=test ./artifact/codex exec --skip-git-repo-check --json \
            -c 'model_provider="mock"' \
            -c 'model_providers.mock={ name = "mock", base_url = "http://127.0.0.1:8765/v1", wire_api = "responses", env_key = "MOCK_API_KEY", requires_openai_auth = false, supports_websockets = false, request_max_retries = 0, stream_max_retries = 0 }' \
            'hello' 2>&1)
          status=$?
          set -e
          echo "--- codex exec output (exit $status) ---"
          echo "$out"
          echo "--- mock requests ---"
          cat "$RUNNER_TEMP/cyber_requests.jsonl"
          echo "--- assertions ---"
          echo "$out" | grep -F 'stream disconnected before completion: stream closed before response.completed'
          echo "$out" | grep -F 'turn.completed'
          if echo "$out" | grep -q 'CYBER_TEST_MARKER_9137'; then
            echo 'FAIL: upstream cyber message leaked into the output'
            exit 1
          fi
          if echo "$out" | grep -q 'cyberPolicy'; then
            echo 'FAIL: cyber classification leaked into the protocol output'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'FAIL: expected codex exec to complete successfully after auto-continue'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/cyber_requests.jsonl" <<'PY'
          import json
          import sys

          records = [
              json.loads(line)
              for line in open(sys.argv[1], encoding="utf-8")
              if line.strip()
          ]
          hello_requests = [r for r in records if "hello" in r["body"]]
          assert hello_requests, "no request contained the original prompt"
          assert hello_requests[0]["response"] == "cyber", "original prompt did not receive cyber policy"
          continuations = [
              r
              for r in records
              if "继续" in r["body"] or "\\u7ee7\\u7eed" in r["body"]
          ]
          assert continuations, "no request contained the automatic 继续 input"
          assert any(r["response"] == "completed" for r in continuations), (
              "the automatic 继续 request was not answered normally"
          )
          print("PASS: cyber policy inserted a network error and auto-continued with 继续")
          PY
          kill "$(cat "$RUNNER_TEMP/mock.pid")" || true
