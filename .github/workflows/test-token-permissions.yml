name: test-token-permissions

on:
  push:
    branches:
      - build/macos-arm64-cyber-net-error
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Probe release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo "repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"
          test_tag="token-test-release-$(date +%s)"
          echo "test_tag=${test_tag}"

          echo "--- create release with target ---"
          gh release create "$test_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$test_tag" \
            --notes "temporary token permission probe" 2>&1
          echo "create exit=$?"

          echo "--- upload asset ---"
          printf 'probe\n' > /tmp/probe-asset.txt
          gh release upload "$test_tag" /tmp/probe-asset.txt --repo "$GITHUB_REPOSITORY" 2>&1
          echo "upload exit=$?"

          echo "--- delete release and tag ---"
          gh release delete "$test_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>&1
          echo "delete exit=$?"
