name: test-token-permissions

on:
  push:
    branches:
      - build/macos-arm64-cyber-net-error
  workflow_dispatch:

jobs:
  annotated-tag-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe annotated tag creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag="token-test-annotated-$(date +%s)"
          echo "tag=${tag}"
          echo "--- create tag object ---"
          tag_obj="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$tag" \
            -f message="temporary annotated tag probe" \
            -f object="${GITHUB_SHA}" \
            -f type=commit --jq .sha 2>&1)" || true
          echo "tag_obj=${tag_obj}"
          echo "--- create tag ref ---"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="${tag_obj}" 2>&1 || true
          echo "ref create exit=$?"
          echo "--- delete tag ref ---"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>&1 || true
          echo "ref delete exit=$?"
