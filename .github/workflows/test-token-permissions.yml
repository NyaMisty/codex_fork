name: test-token-permissions

on:
  push:
    branches:
      - build/macos-arm64-cyber-net-error
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Probe release API with existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag=token-test-existing-20261122

          echo "--- create release for existing tag ---"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --notes "temporary token permission probe" 2>&1 || true
          echo "release create exit=$?"

          echo "--- upload asset ---"
          printf 'probe\n' > /tmp/probe-asset.txt
          gh release upload "$tag" /tmp/probe-asset.txt --repo "$GITHUB_REPOSITORY" --clobber 2>&1 || true
          echo "upload exit=$?"

          echo "--- delete release ---"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>&1 || true
          echo "release delete exit=$?"
