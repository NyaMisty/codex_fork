name: test-token-permissions

on:
  push:
    branches:
      - build/macos-arm64-cyber-net-error
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Probe ref and release APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo "repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"
          branch="token-test-branch-$(date +%s)"

          echo "--- create branch ref ---"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" -f sha="${GITHUB_SHA}" 2>&1 || true
          echo "branch create exit=$?"

          echo "--- delete branch ref ---"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" 2>&1 || true
          echo "branch delete exit=$?"

          echo "--- create release for existing tag ---"
          gh release create rust-v0.169.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title token-test-existing-tag \
            --notes "temporary token permission probe" 2>&1 || true
          echo "release create exit=$?"

          echo "--- delete existing-tag release ---"
          gh release delete rust-v0.169.1 --repo "$GITHUB_REPOSITORY" --yes 2>&1 || true
          echo "release delete exit=$?"
