name: rust-ci-full
on:
  push:
    branches:
      - main
      - "**full-ci**"
  workflow_dispatch:

env:
  # Cargo's libgit2 transport has been flaky on macOS when fetching git
  # dependencies with nested submodules. Use the system git CLI, which has
  # better network/proxy behavior and matches Cargo's own suggested fallback.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          toolchain: nightly-2025-09-18
          components: llvm-tools-preview, rustc-dev, rust-src
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15-xlarge
            runs_on: macos-15
          - name: Windows
            runner: windows-x64
            runs_on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check whether Bazel argument comment lint should run
        id: argument_comment_lint_gate
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping Bazel argument comment lint without BuildBuddy credentials; fork PRs use cargo-native CI plus the binary build artifact."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bazel-ci
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        with:
          target: ${{ runner.os }}
          install-test-prereqs: true
      - name: Install Linux sandbox build dependencies
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && runner.os != 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets="$(./tools/argument-comment-lint/list-bazel-targets.sh)"
          ./.github/scripts/run-bazel-ci.sh \
            -- \
            build \
            --config=argument-comment-lint \
            --keep_going \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            ${bazel_targets}
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && runner.os == 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-argument-comment-lint-bazel.sh \
            --config=argument-comment-lint \
            --platforms=//:local_windows \
            --keep_going \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      # In rust-ci, representative release-profile checks use thin LTO for faster feedback.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.profile == 'release' && 'thin' || 'fat' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-xlarge
            runs_on: macos-15
            target: aarch64-apple-darwin
            profile: dev
          - runner: macos-15-xlarge
            runs_on: macos-15
            target: x86_64-apple-darwin
            profile: dev
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: dev
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            profile: dev
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: dev
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            profile: dev
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            profile: dev
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            profile: dev
            runs_on: windows-11-arm

          # Also run representative release builds on Mac and Linux because
          # there could be release-only build errors we want to catch.
          # Hopefully this also pre-populates the build cache to speed up
          # releases.
          - runner: macos-15-xlarge
            runs_on: macos-15
            target: aarch64-apple-darwin
            profile: release
            artifact: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: release
            artifact: true
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            profile: release
            runs_on: windows-latest
            artifact: true
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            profile: release
            runs_on: windows-11-arm
            artifact: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            packages=(pkg-config libcap-dev zstd)
            if [[ "${{ matrix.target }}" == 'x86_64-unknown-linux-musl' || "${{ matrix.target }}" == 'aarch64-unknown-linux-musl' ]]; then
              packages+=(libubsan1)
            fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Explicit cache restore: split cargo home vs target, so we can
      # avoid caching the large target dir on the gnu-dev job.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Prepare APT cache directories (musl)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists
          sudo chown -R "$USER:$USER" /var/cache/apt /var/lib/apt/lists

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Restore APT cache (musl)
        id: cache_apt_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install musl build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Configure rustc UBSan wrapper (musl host)
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Clear sanitizer flags (musl)
        shell: bash
        run: |
          set -euo pipefail
          # Avoid problematic aws-lc jitter entropy code path on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

          # Clear global Rust flags so host/proc-macro builds don't pull in UBSan.
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          # Override any runner-level Cargo config rustflags as well.
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' }}
        name: Configure musl rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8-musl
        with:
          target: ${{ matrix.target }}

      - name: Install DotSlash for release artifact compression
        if: ${{ matrix.profile == 'release' && matrix.artifact == true && runner.os == 'Windows' }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Ensure zstd for release artifact compression
        if: ${{ matrix.profile == 'release' && matrix.artifact == true && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi
          zstd -V

      - name: cargo clippy (debug/dev)
        if: ${{ matrix.profile == 'dev' }}
        run: cargo clippy --target ${{ matrix.target }} --tests --profile dev --timings -- -D warnings

      - name: cargo clippy (release)
        if: ${{ matrix.profile == 'release' && matrix.artifact != true }}
        run: cargo clippy --target ${{ matrix.target }} --tests --release --timings -- -D warnings

      - name: Upload Cargo timings (clippy)
        if: ${{ always() && (matrix.profile == 'dev' || (matrix.profile == 'release' && matrix.artifact != true)) }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-clippy-${{ matrix.target }}-${{ matrix.profile }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Build codex release artifacts
        id: build_codex_release_artifacts
        if: ${{ matrix.profile == 'release' && matrix.artifact == true }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          release_target_dir="${PWD}/target"

          cargo_with_timeout() {
            # Keep a GitHub-hosted runner from being externally killed mid-build
            # before this step can fail normally and print artifact diagnostics.
            if command -v timeout >/dev/null 2>&1 && timeout --help 2>&1 | grep -q -- '--foreground'; then
              timeout --foreground 330m cargo "$@"
            else
              cargo "$@"
            fi
          }

          build_args="--bin codex"
          built_bins="codex"
          suffix=""
          if [[ "$target" == *windows* ]]; then
            suffix=".exe"
          fi

          if [[ "$target" == *linux* ]]; then
            cargo_with_timeout build --target "$target" --release --locked --timings --bin bwrap
            bwrap_path="${release_target_dir}/${target}/release/bwrap"
            if [[ ! -f "$bwrap_path" ]]; then
              echo "bwrap binary ${bwrap_path} not found"
              exit 1
            fi
            export CODEX_BWRAP_SHA256="$(sha256sum "$bwrap_path" | awk '{print $1}')"
            built_bins="${built_bins} bwrap"
          fi

          if [[ "$target" == *windows* ]]; then
            build_args="${build_args} --bin codex-command-runner --bin codex-windows-sandbox-setup"
            built_bins="${built_bins} codex-command-runner codex-windows-sandbox-setup"
          fi

          cargo_with_timeout build --target "$target" --release --locked --timings ${build_args}

          echo "Built release binary sizes:"
          for binary in ${built_bins}; do
            path="${release_target_dir}/${target}/release/${binary}${suffix}"
            if [[ -f "$path" ]]; then
              printf '%12s  %s\n' "$(wc -c < "$path" | tr -d '[:space:]')" "$path"
            else
              echo "missing: $path"
            fi
          done

      - name: Stage codex binary artifact
        id: stage_codex_binary_artifact
        if: ${{ always() && matrix.profile == 'release' && matrix.artifact == true }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          suffix=""
          if [[ "$target" == *windows* ]]; then
            suffix=".exe"
          fi
          artifact_dir="dist/${target}"
          release_dir="target/${target}/release"
          repo_root="$PWD"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          on_stage_exit() {
            local status=$?
            if (( status != 0 )); then
              mkdir -p "$artifact_dir"
              {
                echo "Stage codex binary artifact failed with exit status ${status}"
                echo "target: ${target}"
                echo "release_dir: ${release_dir}"
                echo
                echo "artifact_dir contents:"
                find "$artifact_dir" -maxdepth 2 -type f -print 2>/dev/null | sort | while IFS= read -r file; do
                  printf '%12s  %s\n' "$(wc -c < "$file" | tr -d '[:space:]')" "$file"
                done || true
                echo
                echo "release_dir contents:"
                find "$release_dir" -maxdepth 2 -type f -print 2>/dev/null | sort | while IFS= read -r file; do
                  printf '%12s  %s\n' "$(wc -c < "$file" | tr -d '[:space:]')" "$file"
                done || true
                echo
                echo "target contents:"
                find target -maxdepth 4 -type f -print 2>/dev/null | sort | while IFS= read -r file; do
                  printf '%12s  %s\n' "$(wc -c < "$file" | tr -d '[:space:]')" "$file"
                done || true
              } > "$artifact_dir/STAGING_FAILED.txt"
            fi
          }
          trap on_stage_exit EXIT

          file_size() {
            wc -c < "$1" | tr -d '[:space:]'
          }

          tree_size() {
            local total=0
            local size
            local file
            while IFS= read -r -d '' file; do
              size="$(file_size "$file")"
              total=$((total + size))
            done < <(find "$1" -type f -print0)
            echo "$total"
          }

          require_file_min_size() {
            local file="$1"
            local min_size="$2"
            if [[ ! -f "$file" ]]; then
              echo "required artifact file is missing: $file"
              exit 1
            fi

            local size
            size="$(file_size "$file")"
            if (( size < min_size )); then
              echo "artifact file $file is only ${size} bytes; expected at least ${min_size} bytes"
              exit 1
            fi
          }

          require_tree_min_size() {
            local dir="$1"
            local min_size="$2"
            local size
            size="$(tree_size "$dir")"
            if (( size < min_size )); then
              echo "artifact directory $dir totals only ${size} bytes; expected at least ${min_size} bytes"
              exit 1
            fi
          }

          write_manifest() {
            {
              echo "target: ${target}"
              echo "release_dir: ${release_dir}"
              echo "artifact_dir: ${artifact_dir}"
              echo
              echo "files:"
              find "$artifact_dir" -type f ! -name ARTIFACT_MANIFEST.txt ! -name SHA256SUMS.txt -print | sort | while IFS= read -r file; do
                printf '%12s  %s\n' "$(file_size "$file")" "$file"
              done
            } > "$artifact_dir/ARTIFACT_MANIFEST.txt"

            (
              cd "$artifact_dir"
              find . -type f ! -name SHA256SUMS.txt -print | sort | while IFS= read -r file; do
                sha256sum "${file#./}"
              done
            ) > "$artifact_dir/SHA256SUMS.txt"
          }

          stage_binary() {
            local binary="$1"
            local min_size="$2"
            local source="${release_dir}/${binary}${suffix}"
            local dest="${artifact_dir}/${binary}-${target}${suffix}"
            if [[ ! -f "$source" ]]; then
              echo "required release binary is missing: $source"
              exit 1
            fi
            cp "$source" "$dest"
            chmod 0755 "$dest" || true
            require_file_min_size "$dest" "$min_size"
          }

          compress_binary() {
            local file="$1"
            local base
            base="$(basename "$file")"
            tar -C "$artifact_dir" -czf "$artifact_dir/${base}.tar.gz" "$base"
            if [[ "$target" == *windows* ]]; then
              "${GITHUB_WORKSPACE}/.github/workflows/zstd" -f -T0 -19 "$file"
            else
              zstd -f -T0 -19 "$file" -o "$artifact_dir/${base}.zst"
            fi
          }

          zip_windows_binary() {
            local file="$1"
            local base
            base="$(basename "$file")"
            if [[ "$base" == "codex-${target}.exe" ]]; then
              local bundle_dir
              bundle_dir="$(mktemp -d)"
              cp "$file" "$bundle_dir/$base"
              cp "$artifact_dir/codex-command-runner-${target}.exe" "$bundle_dir/codex-command-runner.exe"
              cp "$artifact_dir/codex-windows-sandbox-setup-${target}.exe" "$bundle_dir/codex-windows-sandbox-setup.exe"
              (cd "$bundle_dir" && 7z a "$repo_root/$artifact_dir/${base}.zip" .)
              rm -rf "$bundle_dir"
            else
              (cd "$artifact_dir" && 7z a "${base}.zip" "$base")
            fi
          }

          if [[ ! -d "$release_dir" ]]; then
            {
              echo "Release directory is missing: $release_dir"
              echo
              echo "target contents:"
              find target -maxdepth 4 -type f -print 2>/dev/null | sort || true
            } > "$artifact_dir/STAGING_FAILED.txt"
            cat "$artifact_dir/STAGING_FAILED.txt"
            exit 1
          fi

          stage_binary codex 50000000

          if [[ "$target" == *linux* ]]; then
            cp "${release_dir}/bwrap" "$artifact_dir/bwrap-${target}"
            chmod 0755 "$artifact_dir/bwrap-${target}" || true
            require_file_min_size "$artifact_dir/bwrap-${target}" 100000

            bundle_root="$(mktemp -d)"
            mkdir -p "$bundle_root/codex-resources"
            cp "$artifact_dir/codex-${target}" "$bundle_root/codex"
            cp "$artifact_dir/bwrap-${target}" "$bundle_root/codex-resources/bwrap"
            chmod 0755 "$bundle_root/codex" "$bundle_root/codex-resources/bwrap"
            tar -C "$bundle_root" -czf "$artifact_dir/codex-${target}-bundle.tar.gz" \
              codex codex-resources/bwrap
            tar -C "$bundle_root" -cf - codex codex-resources/bwrap |
              zstd -f -T0 -19 -o "$artifact_dir/codex-${target}-bundle.tar.zst"
            rm -rf "$bundle_root"
            require_file_min_size "$artifact_dir/codex-${target}-bundle.tar.gz" 30000000
            require_file_min_size "$artifact_dir/codex-${target}-bundle.tar.zst" 30000000
          fi

          if [[ "$target" == *windows* ]]; then
            stage_binary codex-command-runner 200000
            stage_binary codex-windows-sandbox-setup 200000
          fi

          for file in "$artifact_dir"/*; do
            [[ -f "$file" ]] || continue
            base="$(basename "$file")"
            if [[ "$base" == *.tar.gz || "$base" == *.tar.zst || "$base" == *.zip || "$base" == *.dmg || "$base" == *.sigstore ]]; then
              continue
            fi
            if [[ "$target" == *windows* ]]; then
              zip_windows_binary "$file"
            fi
            compress_binary "$file"
          done

          if [[ "$target" == *windows* ]]; then
            require_file_min_size "$artifact_dir/codex-${target}.exe.zip" 30000000
          fi
          require_file_min_size "$artifact_dir/codex-${target}${suffix}.zst" 30000000
          require_tree_min_size "$artifact_dir" 200000000
          write_manifest

          echo "Staged codex binary artifact contents:"
          find "$artifact_dir" -type f -print | sort | while IFS= read -r file; do
            printf '%12s  %s\n' "$(file_size "$file")" "$file"
          done

      - name: Upload codex binary artifact
        if: ${{ always() && matrix.profile == 'release' && matrix.artifact == true && steps.stage_codex_binary_artifact.outcome == 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: codex-rs/dist/${{ matrix.target }}/**
          if-no-files-found: error

      - name: Upload codex binary failure diagnostics
        if: ${{ always() && matrix.profile == 'release' && matrix.artifact == true && steps.stage_codex_binary_artifact.outcome != 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-failure-diagnostics
          path: codex-rs/dist/${{ matrix.target }}/**
          if-no-files-found: error

      - name: Verify codex binary artifact build
        if: ${{ always() && matrix.profile == 'release' && matrix.artifact == true && (steps.build_codex_release_artifacts.outcome != 'success' || steps.stage_codex_binary_artifact.outcome != 'success') }}
        shell: bash
        run: |
          echo "Release artifact build outcome: ${{ steps.build_codex_release_artifacts.outcome }}"
          echo "Release artifact stage outcome: ${{ steps.stage_codex_binary_artifact.outcome }}"
          exit 1

      # Save caches explicitly; make non-fatal so cache packaging
      # never fails the overall job. Only save when key wasn't hit.
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save APT cache (musl)
        if: always() && !cancelled() && (matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl') && steps.cache_apt_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

  tests:
    name: Tests — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.remote_env == 'true' && ' (remote)' || '' }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    continue-on-error: true
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-xlarge
            runs_on: macos-15
            target: aarch64-apple-darwin
            profile: dev
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            profile: dev
            remote_env: "true"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            profile: dev
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            profile: dev
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            profile: dev
            runs_on: windows-11-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
          fi

      # Some integration tests rely on DotSlash being installed.
      # See https://github.com/openai/codex/pull/7617.
      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Required for bubblewrap to work on Linux CI runners.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ can additionally gate unprivileged user namespaces
          # behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up remote test env (Docker)
        if: ${{ runner.os == 'Linux' && matrix.remote_env == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=codex-remote-test-env
          source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
          echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}" >> "$GITHUB_ENV"

      - name: tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.remote_env }}' == 'true' ]]; then
            cargo nextest run \
              --no-fail-fast \
              --target "${{ matrix.target }}" \
              --cargo-profile ci-test \
              --timings \
              -E \
              'package(codex-core) & (test(/^suite::(agents_md|hierarchical_agents|remote_env|skills)::/) | test(/^suite::view_image::view_image_routes_to_selected_remote_environment$/) | test(/^suite::rmcp_client::(remote_stdio_server_uses_runtime_fallback_cwd_when_config_omits_cwd|remote_stdio_env_var_source_does_not_copy_local_env)$/) | test(/^unified_exec::mod_tests::(unified_exec_uses_remote_exec_server_when_configured|remote_exec_server_rejects_inherited_fd_launches)$/))'
          else
            cargo nextest run \
              --no-fail-fast \
              --target "${{ matrix.target }}" \
              --cargo-profile ci-test \
              --timings
          fi
        env:
          RUST_BACKTRACE: 1
          RUST_MIN_STACK: "8388608" # 8 MiB
          NEXTEST_STATUS_LEVEL: leak

      - name: Upload Cargo timings (nextest)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-nextest-${{ matrix.target }}-${{ matrix.profile }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Tear down remote test env
        if: ${{ always() && runner.os == 'Linux' && matrix.remote_env == 'true' }}
        shell: bash
        run: |
          set +e
          if [[ "${STEPS_TEST_OUTCOME}" != "success" ]]; then
            docker logs codex-remote-test-env || true
          fi
          docker rm -f codex-remote-test-env >/dev/null 2>&1 || true
        env:
          STEPS_TEST_OUTCOME: ${{ steps.test.outcome }}

      - name: verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. See logs for details. Ignoring per fork rust-ci-full artifact policy."

  # --- Gatherer job for the full post-merge workflow --------------------------
  results:
    name: Full CI results
    needs:
      [
        general,
        cargo_shear,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
        lint_build,
        tests,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "arglint: ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"
          echo "lint   : ${{ needs.lint_build.result }}"
          echo "tests  : ${{ needs.tests.result }}"
          [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt failed'; exit 1; }
          [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
          [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          [[ '${{ needs.lint_build.result }}' == 'success' ]] || { echo 'lint_build failed'; exit 1; }
          if [[ '${{ needs.tests.result }}' != 'success' ]]; then
            echo 'tests failed; ignoring per fork rust-ci-full artifact policy'
          fi
